<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0b;cursor:col-resize;user-select:none;-webkit-user-select:none;}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;}
  .tick{width:2px;height:44px;background:#4a4a4a;border-radius:2px;transition:background .15s;}
  body:hover .tick{background:#9a9a9a;height:60px;}
</style></head><body>
<div class="wrap"><div class="tick"></div></div>
<script>
  let dragging = false;
  const start = (e) => { dragging = true; if (window.aqaraSplit) window.aqaraSplit.start(); e.preventDefault(); };
  const end = () => { if (dragging) { dragging = false; if (window.aqaraSplit) window.aqaraSplit.end(); } };
  document.addEventListener('pointerdown', start, { passive: false });
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);

  // 配色跟随主题
  const setTheme = (t) => {
    const dark = (t !== 'light');
    document.body.style.background = dark ? '#0b0b0b' : '#f5f5f5';
    const tick = document.querySelector('.tick');
    if (tick) tick.style.background = dark ? '#3a3a3a' : '#d0d0d0';
  };
  setTheme('dark');
  if (window.aqaraSplit && window.aqaraSplit.onTheme) window.aqaraSplit.onTheme(setTheme);
</script>
</body></html>
