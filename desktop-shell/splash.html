<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{ --ink:#0b0b0b; --fg:#ffffff; --muted:#8a8a8a; }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",system-ui,sans-serif;
    color:var(--fg);user-select:none;-webkit-user-select:none;cursor:default;
    -webkit-app-region:drag;}                        /* 允许拖动窗口 */
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
  .logo{width:236px;height:auto;display:block;}
  .sub{font-size:12.5px;letter-spacing:.34em;color:#c9c9c9;padding-left:.34em;}
  .status{font-size:12.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;margin-top:2px;}
  .dots{display:flex;gap:7px;}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--fg);opacity:.25;animation:pulse 1.2s infinite ease-in-out;}
  .dots i:nth-child(2){animation-delay:.15s;}
  .dots i:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.22;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="build/aqara-wordmark.png" alt="Aqara">
    <div class="sub">空间智能</div>
    <div class="status" id="status">正在启动空间智能引擎…</div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</body>
</html>
